name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões que o deploy do Pages exige
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; cancela builds antigos em andamento
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # ⚠️ Ao migrar para um domínio próprio:
  #   - troque VITE_SITE_URL para o domínio (ex.: https://jcmeletronica.com.br)
  #   - troque SITE_BASE_PATH para "/"
  #   - adicione o arquivo public/CNAME com o domínio
  VITE_SITE_URL: https://luisfmessias.github.io
  SITE_BASE_PATH: /jcm-eletronica/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build estático
        run: bun run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
